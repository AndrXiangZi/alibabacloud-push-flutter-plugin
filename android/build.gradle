group 'com.aliyun.ams.push'
version '1.0'

buildscript {
    ext.kotlin_version = '1.7.10'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        maven { url = uri("https://maven.aliyun.com/repository/public") }
        maven { url = uri("https://maven.aliyun.com/repository/google") }
        maven { url = uri("https://maven.aliyun.com/repository/gradle-plugin") }

        maven {
            url 'https://maven.aliyun.com/nexus/content/repositories/releases/'
        }
        // 配置HMS Core SDK的Maven仓地址。
        maven {
            url 'https://developer.huawei.com/repo/'
        }
        maven {
            url 'https://developer.hihonor.com/repo'
        }

        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 31

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        minSdkVersion 19
    }
    
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
}

dependencies {
    api 'com.aliyun.ams:alicloud-android-push:4.0.0'

    api "com.aliyun.ams:alicloud-android-third-push:4.0.0"
    api "com.aliyun.ams:alicloud-android-third-push-meizu:4.0.0"
    api "com.aliyun.ams:alicloud-android-third-push-vivo:4.0.0"
    api "com.aliyun.ams:alicloud-android-third-push-oppo:4.0.0"
    api "com.aliyun.ams:alicloud-android-third-push-xiaomi:4.0.0"
    api "com.aliyun.ams:alicloud-android-third-push-huawei:4.0.0"
    api "com.aliyun.ams:alicloud-android-third-push-honor:4.0.0"
    api 'com.aliyun.ams:alicloud-android-third-push-fcm:4.0.0'
}
